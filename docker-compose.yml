services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow
      POSTGRES_DB: teamflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/backend/src
    environment:
      NODE_ENV: development
      # Gemini AI - optional, only needed for AI features
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Database
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      DB_USERNAME: teamflow
      DB_PASSWORD: teamflow
      DB_NAME: teamflow
      # Auth
      JWT_SECRET: dev-secret
      # Default admin credentials
      ADMIN_EMAIL: admin@teamflow.com
      ADMIN_PASSWORD: admin123
      ADMIN_FULL_NAME: Admin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
    environment:
      NODE_ENV: development
      # Can be set to "dark", "light" or left empty.
      # If empty use the system theme
      VITE_THEME: ${VITE_THEME:-}
      VITE_API_URL: http://backend:3000
      # Can be set to "true" to activate demo mode
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
